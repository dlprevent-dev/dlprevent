[workspace]
resolver = "2"
members = ["crates/deelpe-core", "crates/deelpe-sensors", "crates/deelpe", "crates/deelpe-server", "crates/deelpe-winagent"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Raise once a year (set 2026-09-06: current versions).
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
