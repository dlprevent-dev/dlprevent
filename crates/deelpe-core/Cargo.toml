[package]
name = "deelpe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
rustls-pemfile = { version = "2", optional = true }
sha2 = { version = "0.11.0", optional = true }
ring = { version = "0.17", optional = true }
x509-parser = { version = "0.18", optional = true }
time = { version = "0.3", optional = true }
unicode-normalization = "0.1"

[features]
default = []
# The release signature (`signing`): the server checks it before staging a
# program, the agents before swapping themselves.
signing = ["dep:ring", "dep:sha2"]
# What an agent needs: capture, reporting, local log. The server has no
# use for any of it.
net = ["signing", "dep:reqwest", "dep:rcgen", "dep:rustls-pemfile", "dep:sha2", "dep:x509-parser", "dep:time", "dep:tracing-subscriber"]
