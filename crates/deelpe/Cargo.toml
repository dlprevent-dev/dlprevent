[package]
name = "deelpe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DLPrevent: lean data-loss detection for macOS and Linux"

[lib]
path = "src/lib.rs"

[[bin]]
name = "deelpe"
path = "src/main.rs"

[dependencies]
deelpe-core = { path = "../deelpe-core", features = ["net"] }
deelpe-sensors = { path = "../deelpe-sensors" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
libc = "0.2"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

# Debian and Ubuntu: `cargo deb -p deelpe`. The same binary as everywhere —
# one `.deb` covers both, because what differs between the distributions is
# the packaging, not the program.
[package.metadata.deb]
name = "deelpe"
maintainer = "de-el-pe"
# iproute2 for `ss`: the network sensor reads the kernel's per-socket byte
# counter out of it. `$auto` does not find that, it is not a library.
depends = "$auto, iproute2"
section = "admin"
priority = "optional"
extended-description = "DLPrevent agent for Linux workstations and servers: watches which process reads from a protected folder and where it sends the data. Reports to the central server (deelpe-server). Needs root for fanotify."
assets = [
  ["target/release/deelpe", "usr/bin/", "755"],
  ["../../packaging/deelpe.service", "lib/systemd/system/", "644"],
  ["../../docs/INSTALL.md", "usr/share/doc/deelpe/", "644"],
]
maintainer-scripts = "../../packaging/deb-agent"
# Not started by the installation: without enrollment the agent watches
# nothing, and a service that runs for nothing only hides that.
systemd-units = { enable = false }
