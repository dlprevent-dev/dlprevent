name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

# Read only: once the repository is public, a pull request from a fork runs
# here too, and needs nothing more.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      # The HTTP and DB tests create a database of their own per test via
      # sqlx::test — so the user needs CREATEDB, and the image's superuser has
      # that anyway. See docs/SERVER.md.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deelpe
          POSTGRES_PASSWORD: deelpe
          POSTGRES_DB: deelpe
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://deelpe:deelpe@127.0.0.1:5432/deelpe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Linux Hermes sensor reads state.db through the system SQLite.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  windows-agent:
    # Most of the workstation agent is cfg(windows): without the target
    # build nobody type-checks that half of it. Same triple as
    # `cargo win`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - run: cargo win

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
