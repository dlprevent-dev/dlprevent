[package]
name = "deelpe-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DLPrevent central server: dashboard and collection point for agents and NAS syslog"

[[bin]]
name = "deelpe-server"
path = "src/main.rs"

[dependencies]
deelpe-core = { path = "../deelpe-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["macros", "json", "http1"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
argon2 = { version = "0.6", features = ["getrandom"] }
rust-embed = "8"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
rustls-pemfile = "2"
x509-parser = "0.18"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.11"
# Signatures of the releases (ed25519). It is in the tree anyway by way of
# rustls — the direct entry pulls in nothing new, it only makes the way
# there visible.
ring = "0.17"
mime_guess = "2"
tokio-util = "0.7"
time = "0.3"
rustls-pki-types = { version = "1", features = ["std"] }
# Two-factor: TOTP (RFC 6238) on HMAC-SHA1; both crates are already in the
# tree anyway by way of sqlx.
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Passkeys (WebAuthn). Pulls OpenSSL in dynamically: runtime image and .deb
# need libssl3.
webauthn-rs = "0.5"
# AbuseIPDB queries and the identity provider. `rustls-no-provider`: the
# provider is already in place (ring, installed in main.rs) — with the full package reqwest would drag
# aws-lc-rs in and the build image would need cmake.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
# Single sign-on: ID token payload and PKCE. Already in the tree by way of
# webauthn-rs.
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }

[package.metadata.deb]
name = "deelpe-server"
maintainer = "de-el-pe"
depends = "$auto, adduser"
section = "admin"
priority = "optional"
extended-description = "Central server for DLPrevent: dashboard, agent enrollment, alerts and counts, syslog intake for NAS devices. Needs Postgres 18 or newer."
assets = [
  ["target/release/deelpe-server", "usr/bin/", "755"],
  ["../../packaging/deelpe-server.service", "lib/systemd/system/", "644"],
  ["../../packaging/deelpe-server.env.example", "etc/deelpe-server/env.example", "600"],
  ["../../docs/SERVER.md", "usr/share/doc/deelpe-server/", "644"],
]
maintainer-scripts = "../../packaging/deb"
systemd-units = { enable = false }
