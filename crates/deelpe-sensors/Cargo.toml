[package]
name = "deelpe-sensors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deelpe-core = { path = "../deelpe-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# fanotify, fstat: the raw syscalls, no wrapper crate for three of them.
libc = "0.2"
# Linux has no signature the kernel vouches for, so the identity of a
# process is the hash of its binary (`ProcessIdentity::Hashed`).
sha2 = "0.11"
# Hermes keeps its sessions in SQLite (state.db). The system library, not
# the bundled one: bundled needs a C cross compiler even for `cargo linux`,
# which only type-checks. libsqlite3-0 is on every Debian/Ubuntu anyway; the
# package declares it. The version matches libsqlite3-sys, which sqlx
# already pulls into the lockfile.
rusqlite = "0.39"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Diagnostics_ToolHelp",
  # In windows-rs, EVENT_TRACE_LOGFILEW and OpenTraceW hang off this
  # feature (FILETIME inside the struct), not off the Etw feature alone.
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
] }
