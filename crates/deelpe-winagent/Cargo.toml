[package]
name = "deelpe-winagent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DLPrevent agent for Windows file servers (Z2, observe only)"

[[bin]]
name = "deelpe-winagent"
path = "src/main.rs"

[dependencies]
deelpe-core = { path = "../deelpe-core", features = ["net"] }
deelpe-sensors = { path = "../deelpe-sensors" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
quick-xml = "0.42"
# The checksum over the group list is pure logic and gets tested on the Mac
# as well; sha2 does not hang on any platform.
sha2 = "0.11"

[target.x86_64-pc-windows-gnu.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_EventLog", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Security_Authentication_Identity", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_Storage_InstallableFileSystems", "Win32_System_Pipes", "Win32_System_Registry", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_System_Rpc"] }
windows-service = "0.8.1"
