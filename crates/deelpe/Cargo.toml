[package]
name = "deelpe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DLPrevent: lean data-loss detection for macOS and Linux"

[lib]
path = "src/lib.rs"

[[bin]]
name = "deelpe"
path = "src/main.rs"

[dependencies]
deelpe-core = { path = "../deelpe-core", features = ["net"] }
deelpe-sensors = { path = "../deelpe-sensors" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
libc = "0.2"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
