# Keycloak for testing single sign-on in the lab. Not for production:
# dev mode, its own CA, users with printed passwords. setup.sh writes .env,
# certs/ and import/ before this starts.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=${KC_PORT}
      - --https-certificate-file=/certs/keycloak.pem
      - --https-certificate-key-file=/certs/keycloak.key
      - --hostname=https://${KC_HOST}:${KC_PORT}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "${KC_PORT}:${KC_PORT}"
    volumes:
      - ./certs:/certs:ro
      - ./import:/opt/keycloak/data/import:ro
    restart: unless-stopped
