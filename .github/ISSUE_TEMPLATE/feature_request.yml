name: Feature request
description: Something DLPrevent should do that it does not yet
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not belong here. Send them to security@dlprevent.ch, see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [macOS agent, Windows agent, Linux agent, Server / dashboard, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The situation and what gets in the way today — not yet the solution.
      placeholder: When a user copies a folder to a USB stick, I want to see ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could DLPrevent help?
      description: What you imagine, if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A workaround, another tool, or nothing.
