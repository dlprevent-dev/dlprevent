[package]
name = "deelpe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DLPrevent: lean data-loss detection for macOS and Linux"

[lib]
path = "src/lib.rs"

[[bin]]
name = "deelpe"
path = "src/main.rs"

[dependencies]
deelpe-core = { path = "../deelpe-core", features = ["net"] }
deelpe-sensors = { path = "../deelpe-sensors" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
libc = "0.2"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

# Debian and Ubuntu: `cargo deb -p deelpe`. The same binary as everywhere —
# one `.deb` covers both, because what differs between the distributions is
# the packaging, not the program.
[package.metadata.deb]
name = "deelpe"
maintainer = "de-el-pe"
# iproute2 for `ss`: the network sensor reads the kernel's per-socket byte
# counter out of it. nftables for the network cage of strict folders with
# `enforce`. `$auto` finds neither, they are not libraries.
depends = "$auto, iproute2, nftables"
section = "admin"
priority = "optional"
extended-description = "DLPrevent agent for Linux workstations and servers: watches which process reads from a protected folder and where it sends the data. Reports to the central server (deelpe-server). Needs root for fanotify."
# The unit is not in here: cargo-deb installs it itself, see
# `systemd-units` below. Listed in both places it would be packaged twice.
assets = [
  ["target/release/deelpe", "usr/bin/", "755"],
  ["../../docs/INSTALL.md", "usr/share/doc/deelpe/", "644"],
]
maintainer-scripts = "../../packaging/deb-agent"
# Enabled and started by the installation, and restarted on upgrade — the
# cargo-deb defaults.
#
# This used to be off, on the argument that an agent without an enrollment
# watches nothing and a service running for nothing hides that. It hides
# nothing: `deelpe status` and the dashboard both say "not connected" in
# plain words. What it did instead was leave a dead service behind on every
# machine that installed the package, showing up as an agent that never
# appears — which is what happened on 2026-09-12. Windows starts its service
# during the install and macOS lets the app do it; Linux was the one platform
# where a finished install left nothing running.
#
# `unit-scripts` has to be said out loud: cargo-deb looks for the unit next
# to the maintainer scripts, not among the assets, and silently ships a
# package without any systemd handling at all when it finds none — which is
# how the service came to need starting by hand.
systemd-units = { unit-scripts = "../../packaging", unit-name = "deelpe" }
